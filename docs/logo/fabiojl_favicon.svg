<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgFav" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f2333"/>
      <stop offset="100%" stop-color="#12141d"/>
    </radialGradient>
    <filter id="haloFav" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- circular badge, bold and simple for tiny sizes -->
  <circle cx="32" cy="32" r="30" fill="url(#bgFav)"/>

  <!-- two rings only, thick enough to survive downscaling -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#d8dbf7" stroke-width="2" opacity="0.9"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#8f97cf" stroke-width="1.6" opacity="0.6"/>

  <!-- beam center -->
  <circle cx="32" cy="32" r="2" fill="#f4f5fc"/>

  <!-- three Julia-brand peaks, enlarged and bold -->
  <g filter="url(#haloFav)">
    <circle cx="45" cy="21" r="4.6" fill="#CB3C33"/>
    <circle cx="41" cy="30" r="4.6" fill="#389826"/>
    <circle cx="34" cy="17" r="4.6" fill="#9558B2"/>
  </g>
</svg>
